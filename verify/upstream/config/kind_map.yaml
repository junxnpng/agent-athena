# Deterministic mapping from an extractor's free-form `kind` label to the contract's
# three kinds. The label that starts earliest in the string wins (ties: the longer
# label). A string with no listed label is quarantined as kind_unmapped.
# "2차 인용" (secondary citation) and "합성 설정" (synthetic setup) are deliberately
# absent: on their own they say nothing about who makes the claim.
labels:
  measurement:
    - 실제 관측
    - 실제 프로덕션 트레이스
    - 실배포 관측
    - 저자 트레이스 관측
    - 테스트베드
    - 저자의 마이크로벤치마크 측정
  author_interpretation:
    - 저자의 해석
    - 저자의 논증
    - 저자의 요약
    - 저자의 가설
    - 저자의 분석
    - 저자의 분류
    - 저자의 문제 규정
    - 저자의 한계 서술
    - 저자의 위치 짓기
    - 설계·구현 설명
    - 설계·기전 설명
    - 기전 설명
    - 방법 설명
  extrapolation:
    - 저자의 계산
    - 저자의 모형
    - 시뮬레이션
